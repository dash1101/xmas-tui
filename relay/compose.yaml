# xmas-relay, for /opt/xmas-relay/compose.yaml on the server. Both ports are
# published on 127.0.0.1 only: the Cloudflare tunnel (on the same machine)
# reaches them there, and nothing else on the network can.
#   xmas-relay.novalabs.app → http://localhost:8080   (public: the game's WebSocket at /mqtt, long polling at /poll)
#   xmas-admin.novalabs.app → http://localhost:8081   (behind Cloudflare Access)
services:
  xmas-relay:
    image: ghcr.io/dash1101/xmas-relay:1.2.2
    container_name: xmas-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    environment:
      # the admin's Cloudflare Access login (in .env beside this file): the
      # console answers only requests Access signed in as that address
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      TRUST_CF: "1"
    volumes:
      # limits and bans (owned by uid 10001, the container's user)
      - ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 2
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
