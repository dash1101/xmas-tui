# xmas-relay and its own host, for /opt/xmas-relay/compose.yaml on the
# server. The relay's two ports are published on 127.0.0.1 only: the
# Cloudflare tunnel (on the same machine) reaches them there, and nothing
# else on the network can. The host has no ports: it reaches the relay on
# this compose's own network, and signs in with HOST_TOKEN (in .env).
#   xmas-relay.novalabs.app → http://localhost:8080   (public: the game's WebSocket at /mqtt, long polling at /poll)
#   xmas-admin.novalabs.app → http://localhost:8081   (behind Cloudflare Access)

# (every service's log kept to 30 MB: the disk can't fill up with it)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  xmas-relay:
    # (unset: the newest; RELAY_TAG=1.4.0 in .env keeps it at a version)
    image: ghcr.io/dash1101/xmas-relay:${RELAY_TAG:-latest}
    container_name: xmas-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    environment:
      # the admin's Cloudflare Access login (in .env beside this file): the
      # console answers only requests Access signed in as that address
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      TRUST_CF: "1"
      # behind a proxy of one's own instead (TRUST_CF "0"): the header it puts
      # the player's address in (X-Real-IP, X-Forwarded-For); see SELF-HOSTING.md
      IP_HEADER: ${IP_HEADER:-}
      # the secret the relay's own host signs in with (in .env; unset: no host)
      HOST_TOKEN: ${HOST_TOKEN:-}
      # the console checks Cloudflare Access's signed token, not just its
      # email header: the team (e.g. "dash-project-nova") and the console
      # application's AUD tag (Zero Trust → Access → Applications)
      ACCESS_TEAM: ${ACCESS_TEAM:-}
      ACCESS_AUD: ${ACCESS_AUD:-}
    logging: *logging
    volumes:
      # limits and bans (owned by uid 10001, the container's user)
      - ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 2
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  xmas-host:
    # (unset: the newest; HOST_TAG=1.25.2 in .env keeps it at a version)
    image: ghcr.io/dash1101/xmas-host:${HOST_TAG:-latest}
    container_name: xmas-host
    restart: unless-stopped
    depends_on: [xmas-relay]
    environment:
      XMAS_RELAY: ws://xmas-relay:8080/mqtt
      HOST_TOKEN: ${HOST_TOKEN:-}
    logging: *logging
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1

  # The updater, for the console's "update" button and for looking after
  # things by itself: an update every day at AUTO_UPDATE (UTC; it only
  # starts a service again when there's a newer image), old images cleared
  # away, and the relay started again if it stops answering. Off unless
  # asked for: COMPOSE_PROFILES=updater and PROJECT_DIR=<this folder's full
  # path> in .env, and updater/update.sh beside this file.
  #
  # It holds the Docker socket, which is full control of Docker on this
  # machine. So it has no ports and no network at all, a read-only file
  # system, and takes requests only as a file from the relay's data folder,
  # whose content it never reads. Without it, updating is by hand:
  # docker compose pull && docker compose up -d
  xmas-updater:
    profiles: ["updater"]
    image: docker:27-cli
    container_name: xmas-updater
    restart: unless-stopped
    network_mode: none
    working_dir: ${PROJECT_DIR:-/opt/xmas-relay}
    command: ["sh", "updater/update.sh"]
    environment:
      PROJECT_DIR: ${PROJECT_DIR:-/opt/xmas-relay}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-xmas-relay}
      # (no settings of its own to read or write: the images are public)
      DOCKER_CONFIG: /nonexistent
      # the daily update, in UTC ("09:30" is 4:30 in the morning in New
      # York in winter); empty: none
      AUTO_UPDATE: ${AUTO_UPDATE-09:30}
    logging: *logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # (the same path inside as on the machine, so "./data" means the same)
      - ./:${PROJECT_DIR:-/opt/xmas-relay}:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
