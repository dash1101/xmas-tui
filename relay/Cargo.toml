[package]
name = "xmas-relay"
version = "1.1.0"
edition = "2021"
description = "The xmas-tui village's own relay: just enough MQTT over WebSocket for online play, with an admin console"
license = "MIT"
repository = "https://github.com/dash1101/xmas-tui"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
