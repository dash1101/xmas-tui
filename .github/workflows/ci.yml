name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - run: ./packaging/linux/build-deb.sh 0.0.0 target/release/xmas-tui /tmp/deb && dpkg-deb -c /tmp/deb/*.deb
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: installer builds
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item target\release\xmas-tui.exe, config.example.toml, LICENSE stage\
          Copy-Item packaging\README-Windows.txt stage\README.txt
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=0.0.0" "/DSrc=$pwd\stage" "/O$pwd" packaging\windows\xmas-tui.iss
          if (-not (Test-Path xmas-tui-setup-x86_64.exe)) { exit 1 }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: builds, signed with the release key when the secrets are there (a throwaway one otherwise)
        env:
          XMAS_KEYSTORE_B64: ${{ secrets.XMAS_KEYSTORE_B64 }}
          XMAS_KEYSTORE_PASSWORD: ${{ secrets.XMAS_KEYSTORE_PASSWORD }}
          XMAS_KEYSTORE: ${{ runner.temp }}/k.jks
          XMAS_KEYPASS: ${{ runner.temp }}/k.pass
          ANDROID_PLATFORM: android-35
          ANDROID_BUILD_TOOLS: 35.0.0
        run: |
          printf "y\n%.0s" {1..8} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          if [ -n "$XMAS_KEYSTORE_B64" ] && [ -n "$XMAS_KEYSTORE_PASSWORD" ]; then
            echo "$XMAS_KEYSTORE_B64" | base64 -d > "$XMAS_KEYSTORE"
            printf '%s' "$XMAS_KEYSTORE_PASSWORD" > "$XMAS_KEYPASS"
            export XMAS_EXPECT_CERT="$(cat android/release-cert.sha256)"
          else
            export XMAS_NEW_KEY=1
          fi
          android/build.sh "" "$RUNNER_TEMP/check.apk"
          rm -f "$XMAS_KEYSTORE" "$XMAS_KEYPASS"
