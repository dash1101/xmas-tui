name: relay

# The village's own relay as a container image (amd64), on GitHub's registry:
# ghcr.io/dash1101/xmas-relay:<version> and :latest. Built when the relay
# changes, or by hand.
on:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The relay's tests
        working-directory: relay
        run: cargo test --release
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "version=$(grep -m1 '^version' relay/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/xmas-relay:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/xmas-relay:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=The xmas-tui village's own relay for online play
            org.opencontainers.image.licenses=MIT
