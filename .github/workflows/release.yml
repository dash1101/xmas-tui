# Push a tag like v1.2.3 → build Linux, Windows and the Android live wallpaper,
# publish a GitHub release with them and SHA256SUMS (what the in-app updater
# and Orbit download). The APK is signed with the release key from the
# repository's secrets; without them the release has no APK. It's attached
# only when android/ or src/ (the village the app plays, built into it)
# changed since the newest release that has it (so phones aren't offered an
# identical update), or when none of the last 7 releases has it: Orbit takes
# the newest release with the APK, looking back 10.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04 # older glibc: runs on most current distros
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: version matches tag
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml
      - run: cargo test --release
      - run: cargo build --release
        env:
          XMAS_RELEASE: "1"
      - name: package
        run: |
          cp target/release/xmas-tui xmas-tui-linux-x86_64
          cp scripts/get.sh xmas-tui-linux-installer.sh
          ./packaging/linux/build-deb.sh "${GITHUB_REF_NAME#v}" target/release/xmas-tui .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            xmas-tui-linux-x86_64
            xmas-tui-linux-installer.sh
            xmas-tui_*_amd64.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
        env:
          XMAS_RELEASE: "1"
      - name: package
        shell: bash
        run: |
          cp target/release/xmas-tui.exe xmas-tui-windows-x86_64.exe
          mkdir xmas-tui-windows
          cp target/release/xmas-tui.exe xmas-tui-windows/
          cp packaging/README-Windows.txt xmas-tui-windows/README.txt
          cp config.example.toml LICENSE assets/fonts/LICENSE-*.txt xmas-tui-windows/
          7z a xmas-tui-windows.zip xmas-tui-windows
      - name: installer (per-user, no admin)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $ver = "${{ github.ref_name }}".TrimStart("v")
          & $iscc "/DAppVersion=$ver" "/DSrc=$pwd\xmas-tui-windows" "/O$pwd" packaging\windows\xmas-tui.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            xmas-tui-windows-x86_64.exe
            xmas-tui-windows.zip
            xmas-tui-setup-x86_64.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # history and tags, to compare with the previous release
      - name: is a new APK due?
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the newest of the last 7 releases with the APK (this one isn't
          # published yet)
          last=""
          for t in $(gh release list -R "$GITHUB_REPOSITORY" -L 7 --exclude-drafts --json tagName -q '.[].tagName'); do
            if gh release view "$t" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx xmas-tui-android.apk; then
              last=$t
              break
            fi
          done
          if [ -z "$last" ]; then
            echo "no APK in the last 7 releases: building it"
            echo "due=1" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "$last" "$GITHUB_REF_NAME" -- android/ src/ assets/; then
            echo "android/ or the village (src/) changed since $last (the newest release with the APK): building it"
            echo "due=1" >> "$GITHUB_OUTPUT"
          else
            echo "android/ and src/ unchanged since $last, which has the APK: none in this release"
          fi
      - uses: actions/setup-java@v5
        if: steps.due.outputs.due == '1'
        with: { distribution: temurin, java-version: '17' }
      # the village to play in is the desktop's own, built for each Android ABI
      - uses: dtolnay/rust-toolchain@stable
        if: steps.due.outputs.due == '1'
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
        if: steps.due.outputs.due == '1'
        with: { workspaces: android/native }
      - name: signing key (repository secrets)
        id: key
        if: steps.due.outputs.due == '1'
        env:
          XMAS_KEYSTORE_B64: ${{ secrets.XMAS_KEYSTORE_B64 }}
          XMAS_KEYSTORE_PASSWORD: ${{ secrets.XMAS_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$XMAS_KEYSTORE_B64" ] || [ -z "$XMAS_KEYSTORE_PASSWORD" ]; then
            echo "::warning::No XMAS_KEYSTORE_B64 / XMAS_KEYSTORE_PASSWORD secrets: this release has no Android app. Build it with android/build.sh and upload it (README.md, Android live wallpaper)."
            exit 0
          fi
          echo "$XMAS_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/xmas-tui.jks"
          printf '%s' "$XMAS_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore.pass"
          echo "have=1" >> "$GITHUB_OUTPUT"
      - name: build and sign
        if: steps.key.outputs.have == '1'
        env:
          XMAS_KEYSTORE: ${{ runner.temp }}/xmas-tui.jks
          XMAS_KEYPASS: ${{ runner.temp }}/keystore.pass
          ANDROID_PLATFORM: android-35
          ANDROID_BUILD_TOOLS: 35.0.0
        run: |
          printf "y\n%.0s" {1..8} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          XMAS_EXPECT_CERT="$(cat android/release-cert.sha256)" \
            android/build.sh "${GITHUB_REF_NAME#v}" "$PWD/xmas-tui-android.apk"
          rm -f "$XMAS_KEYSTORE" "$XMAS_KEYPASS"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.have == '1'
        with:
          name: android
          path: xmas-tui-android.apk

  publish:
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=.github/release-notes/${GITHUB_REF_NAME}.md
          if [ -f "$notes" ]; then flag=(--notes-file "$notes"); else flag=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "xmas-tui $GITHUB_REF_NAME" "${flag[@]}"

  # the relay's own host, as a container image (amd64), from this release's
  # Linux build: ghcr.io/<owner>/xmas-host:<version> and :latest
  host-image:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: this release's Linux build, checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p xmas-tui-linux-x86_64 -p SHA256SUMS -D host
          cd host && grep " xmas-tui-linux-x86_64$" SHA256SUMS | sha256sum -c && mv xmas-tui-linux-x86_64 xmas-tui && chmod +x xmas-tui
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: host
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/xmas-host:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/xmas-host:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=The xmas-tui relay's own host: the squares and server villages, kept open
            org.opencontainers.image.licenses=LicenseRef-xmas-tui-source-available

