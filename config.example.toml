# xmas-tui config — copy to ~/.config/xmas-tui/config.toml
# Every field is optional; these are the defaults.

fps = 30          # frames per second (lower = less CPU)
seed = 0          # 0 = new random layout each launch; any other number = fixed layout
scale = 1.0       # render scale, 0.5..2 (bigger = chunkier pixels, fewer cells)

[scene]
aurora = true
snow = 1.0            # snowfall density multiplier, 0 disables snow
wind = 1.0            # wind strength multiplier
sleigh_minutes = 4.0  # average minutes between Santa fly-bys, 0 disables
glow = 1.0            # light/bloom intensity
critters = 1.0        # how many animals & people come by (0 = none)
bushes = true         # festive berry bushes the animals snack from
player = true         # the villager walked around with WASD / the arrow keys
walk_speed = 1.0      # how fast the villager walks (0.25..6)
time = "auto"         # time of day: "auto" (real sunrise & sunset at the weather city),
                      # or "night", "dawn", "morning", "noon", "afternoon", "dusk"
traffic = "auto"      # side of the road: "auto" (from the weather city), "right" or "left"
talk_time = 1.0       # how long speech bubbles stay up (0.5..3; longer lines always stay longer)
chattiness = 1.0      # how often people stop to talk and remark on things (0 = quiet .. 2)

[scene.pet]           # the villager's own pet (named in the village, or here)
kind = "dog"          # "dog", "cat", "bunny" or "none"
coat = "golden"       # dog: golden chocolate black snowy spotty grey red
                      # cat: ginger black snowy tabby calico cream tuxedo
                      # bunny: snowy brown grey black cream
name = ""             # empty: it asks the first time they meet

[clock]
enabled = true
hour24 = false
seconds = false
countdown = true      # "40 days 10:57:34 until Christmas"

[widgets]
system = true         # CPU / GPU / VRAM / RAM / disk / network
music = true          # now playing, from any MPRIS player (browsers, Spotify, …)
weather = true
map = true            # a strip map of the whole village
disk = "/"            # mount point shown in the DISK row

[weather]
city = ""             # e.g. "Oslo" or "Denver, CO" — looked up via Open-Meteo (no API key)
# latitude = 39.77    # or set coordinates directly instead of a city
# longitude = -86.16
units = "fahrenheit"  # or "celsius"
refresh_minutes = 15

[sound]               # everything is synthesized — no audio files
enabled = true
master = 0.5          # 0..1 slider positions
music = 0.6           # generated music: original tunes + public-domain carols
sfx = 0.7             # effects: presents, snowman, sleigh bells, church bells, fireworks…
ambience = 0.5        # wind, snowfall, a crackling fire, distant chimes
track = "shuffle"     # or one style: "music-box", "celesta", "piano", "sleigh-ride"
cursor = true         # a soft sparkle when the cursor moves fast
pause_for_media = true  # fade out while another app plays media (a video, music…)

[sound.effects]       # per-effect volumes, 0..1.5 (on top of `sfx`)
presents = 1.0
snowman = 1.0
animals = 1.0         # deer snorts, fox yips, rabbit thumps, munching
people = 1.0          # greetings, giggles, petting "aww"s
handling = 1.0        # picking someone up / dropping them in the snow
bushes = 1.0          # bush rustles and cardinals
sleigh = 1.0
stars = 1.0
bells = 1.0
fireworks = 1.0
sparkles = 1.0
snow = 1.0
switches = 1.0
train = 1.0
fanfare = 1.0
cursor = 1.0

[sound.ambience_mix]  # ambience layers, 0..1.5 (on top of `ambience`)
wind = 1.0
snowfall = 1.0
fire = 1.0
chimes = 1.0
aurora = 1.0

[windows]             # snow & lights on open windows (KDE Plasma Wayland, Windows)
snow = true
lights = true
pile_rows = 1.5       # max pile height, in text rows
density = 1.0         # falling snow in front of windows
front = true          # false: flakes stay invisible (piles still grow) — nothing drifts over the work underneath
docks = true          # snow settles on the taskbar / panels too
settle = 1.0          # how fast piles build up
light_style = "multi" # "multi", "warm", "icy" or "candy"
light_windows = 6     # how many windows (topmost first) get lights
light_glow = 1.0      # bulb brightness
dock_rows = 1.5       # max pile height on the taskbar / panels
fall = 1.0            # how fast the flakes fall
wind = 1.0            # how much the wind blows them about
shake = 1.0           # how easily shaking a window throws its snow off (0: never)
brush = true          # sweeping the cursor through a pile brushes it away
melt = 0.0            # piles slowly melt away (0: never)

[updates]             # release builds only
check = true          # look for a new version now and then
auto_install = false  # install it without asking (otherwise a banner asks first)
