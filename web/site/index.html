<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#03050f">
<title>Village</title>
<link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- added to a phone's home screen: an app of its own, full screen -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Village">
<meta name="description" content="A snowy Christmas village to walk about in: talk to the neighbours, build snowmen and igloos, snowball fights, a ski trip, games by the fire.">
<style>
  :root { --gold: #ffd36b; --panel: rgba(16, 20, 42, 0.96); --text: #f4ecd8; --dim: #8a90a8; --hot: #34406a; }
  html, body { margin: 0; height: 100%; background: #03050f; overflow: hidden; touch-action: none; overscroll-behavior: none; }
  canvas { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  #pad { width: 100vw; height: 100vh; pointer-events: none; }
  body.touch #pad { pointer-events: auto; }
  .box { position: fixed; background: var(--panel); color: var(--text); border: 1px solid var(--gold); border-radius: 3px; font: calc(14px * var(--ui, 1))/1.45 ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  /* (clear of a phone's notch and rounded corners) */
  #bar { top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); display: flex; gap: 2px; padding: 1px 4px; font-size: calc(14px * var(--btn, 1) * var(--unit, 1)); }
  #bar span { cursor: pointer; padding: 0 7px; }
  #bar span:hover { color: var(--gold); }
  #opts { display: none; width: min(94vw, 440px); max-height: min(86vh, 640px); flex-direction: column; }
  #opts.open { display: flex; }
  #opts .title { display: flex; align-items: center; padding: 0 8px; border-bottom: 1px solid var(--gold); cursor: move; user-select: none; touch-action: none; }
  #opts .title b { color: var(--gold); font-weight: normal; flex: 1; padding: 3px 0; }
  #opts .title i { font-style: normal; color: var(--dim); margin-right: 8px; }
  #opts .title u { text-decoration: none; cursor: pointer; color: var(--dim); padding: 0 4px; }
  #opts .title u:hover { color: var(--gold); }
  #tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 8px 0; }
  #tabs span { cursor: pointer; padding: 1px 8px; border: 1px solid #3a4470; color: var(--dim); }
  #tabs span.on { color: #14162a; background: var(--gold); border-color: var(--gold); }
  #pane { overflow: auto; padding: 6px 12px 10px; }
  #pane h3 { margin: 10px 0 4px; font-size: 13px; color: var(--gold); font-weight: normal; }
  #pane h3::before { content: "❄ "; }
  .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; min-height: 24px; }
  .row > label { flex: 1; }
  .row output { color: var(--gold); min-width: 46px; text-align: right; }
  .row input[type=range] { width: 130px; accent-color: var(--gold); }
  .row input[type=checkbox] { accent-color: var(--gold); width: 16px; height: 16px; }
  #pane input[type=text], #pane select { background: #0b1020; color: var(--text); border: 1px solid #4a5480; font: inherit; padding: 1px 4px; }
  #pane input[type=text] { width: 150px; }
  .note { color: var(--dim); font-size: 12.5px; margin: 2px 0 6px; }
  .btn { display: inline-block; cursor: pointer; margin: 4px 6px 0 0; padding: 1px 10px; color: #14162a; background: var(--gold); border: 0; font: inherit; }
  .btn.quiet { background: #24305a; color: var(--text); border: 1px solid var(--gold); }
  .friend { border: 1px solid #3a4470; padding: 4px 8px; margin: 6px 0; }
  .friend .row select { max-width: 92px; }
  #safe { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #b-install { display: none; }
  /* (the buttons up top are drawn in the village now, the same on every
     device; the page's own bar is kept only for its sizes) */
  #bar { display: none !important; }
  #kb { position: fixed; left: 0; bottom: 0; width: 2px; height: 2px; opacity: 0; border: 0; padding: 0; font-size: 16px; pointer-events: none; }
  #ask { display: none; left: 50%; bottom: 22%; transform: translateX(-50%); width: min(92vw, calc(520px * var(--ui, 1))); padding: 8px 10px 10px; }
  #ask.open { display: block; }
  #ask-q { white-space: pre-line;  color: var(--gold); margin-bottom: 6px; }
  #ask-in { width: 100%; box-sizing: border-box; background: #0b1020; color: var(--text); border: 1px solid var(--gold); font: inherit; padding: 4px 6px; outline: none; }
  #ask-hint { color: var(--dim); font-size: 0.86em; margin-top: 4px; }
  #ask .btns { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }
  #toast { left: 50%; bottom: 18px; transform: translateX(-50%); padding: 3px 12px; display: none; pointer-events: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--gold); font: 18px ui-monospace, monospace; }
  @media (max-width: 520px) { .row input[type=range] { width: 100px; } }
</style>
</head>
<body>
<canvas id="village"></canvas>
<canvas id="pad"></canvas>
<div id="loading">❄ the village is waking up…</div>
<div id="bar" class="box"><span id="b-todo" title="things to do (T)">✦ do</span><span id="b-more" title="more (pockets, invite along, lie down…)">☰</span><span id="b-centre" title="back to the villager (C)">⌖</span><span id="b-pause" title="pause the village (P)">⏸</span><span id="b-install" title="install the village as an app">⤓ app</span><span id="b-chat" title="chat (/)">☺</span><span id="b-online" title="friends & online: play together (O)">✉</span><span id="b-sound" title="sound on / off">♪</span><span id="b-help" title="controls (?)">?</span><span id="b-opts" title="settings">⚙</span></div>
<div id="opts" class="box">
  <div class="title" id="o-grip"><i>⠿</i><b>⚙ settings</b><u id="o-close" title="close">✕</u></div>
  <div id="tabs"></div>
  <div id="pane"></div>
</div>
<div id="toast" class="box"></div>
<form id="ask" class="box" autocomplete="off"><div id="ask-q"></div><input id="ask-in" maxlength="280" enterkeyhint="send"><div id="ask-hint">Enter: send · Esc: never mind</div><div class="btns"><button type="button" class="btn quiet" id="ask-no">never mind</button><button type="submit" class="btn">send</button></div></form>
<input id="o-file" type="file" accept=".toml,text/plain" hidden>
<div id="safe"></div>
<input id="kb" maxlength="280" autocomplete="off" autocorrect="on" spellcheck="false" enterkeyhint="send" aria-label="type here">
<script src="xmas.js"></script>
</body>
</html>
