# The village in a web page: the desktop's own scene, frame and renderer
# (the same source files, see src/lib.rs) and the Android app's game driver,
# built for WebAssembly and drawn onto a canvas by site/xmas.js. No sound yet.
#
#   cargo build --release --target wasm32-unknown-unknown
#   cp target/wasm32-unknown-unknown/release/xmas_web.wasm site/xmas.wasm
[package]
name = "xmas-web"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
sha2 = "0.10"
toml = "0.8"
fontdue = "0.9"
png = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
